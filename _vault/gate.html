<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; worker-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>Acceso privado · Local Outreach</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/_vault/gate.css">
  <script src="/_vault/gate.js" defer></script>
</head>
<body>
  <main>
    <div class="brand"><span aria-hidden="true">↗</span> LOCAL OUTREACH</div>
    <p class="eyebrow">ESPACIO PRIVADO</p>
    <h1>El trabajo,<br>de puertas adentro.</h1>
    <p class="intro">Introduce la contraseña para abrir el archivo de webs.</p>
    <form id="unlock-form">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button id="unlock" type="submit" disabled>Preparando acceso…</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
    <noscript>Activa JavaScript para descifrar este espacio privado.</noscript>
    <p class="foot">Acceso por invitación. Cierra la sesión con «Bloquear» al terminar.</p>
  </main>
  <aside aria-hidden="true"><div class="ring"></div><div class="ring second"></div><span>LO / ARCHIVO</span></aside>
</body>
</html>
